<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>フリマ在庫リスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=DM+Sans:opsz,wght@9..40,500;9..40,700&display=swap">
<style>
/* Layout: iOS風の2タブ（下部タブバー）。在庫＝リマインダー風リスト、収支＝月別/週別の期間ナビ＋棒グラフ＋内訳 */
:root{
  --bg:#f2f2f6; --surface:#ffffff; --fg:#1c1c1f; --muted:#8a8a93; --line:#e4e4ea; --accent:#e5484d; --field:#f4f4f7;
  --s0:#8e8e98; --s1:#e5484d; --s2:#d98a1c; --s3:#2f7de1; --s4:#2f9e5b;
  --s0bg:#ececf0; --s1bg:#fdecec; --s2bg:#fbf1e1; --s3bg:#e7f0fc; --s4bg:#e5f4ea;
  --plus:#2f9e5b; --minus:#e5484d; --barSale:#2f9e5b; --barCost:#c3c3cc; --bar:rgba(255,255,255,.88);
  --font:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --num:"DM Sans","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000; --surface:#1c1c1e; --fg:#f2f2f5; --muted:#8e8e96; --line:#2c2c30; --accent:#ff6369; --field:#2a2a2e;
  --s0:#a0a0aa; --s1:#ff6369; --s2:#f0a53a; --s3:#5b9cf0; --s4:#4cc27a;
  --s0bg:#2a2a2e; --s1bg:#3a1c1e; --s2bg:#3a2a14; --s3bg:#16263b; --s4bg:#16301f;
  --plus:#4cc27a; --minus:#ff6369; --barSale:#4cc27a; --barCost:#55555e; --bar:rgba(28,28,30,.88); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000; --surface:#1c1c1e; --fg:#f2f2f5; --muted:#8e8e96; --line:#2c2c30; --accent:#ff6369; --field:#2a2a2e;
  --s0:#a0a0aa; --s1:#ff6369; --s2:#f0a53a; --s3:#5b9cf0; --s4:#4cc27a;
  --s0bg:#2a2a2e; --s1bg:#3a1c1e; --s2bg:#3a2a14; --s3bg:#16263b; --s4bg:#16301f;
  --plus:#4cc27a; --minus:#ff6369; --barSale:#4cc27a; --barCost:#55555e; --bar:rgba(28,28,30,.88); color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:24px 16px calc(96px + env(safe-area-inset-bottom, 0px))}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px}
h1{font-size:30px;font-weight:700;margin:0;letter-spacing:.01em}
.edit-btn{background:none;border:0;color:var(--accent);font:500 16px var(--font);cursor:pointer;padding:4px}
.yen{font-family:var(--num);font-variant-numeric:tabular-nums}
.pos{color:var(--plus)} .neg{color:var(--minus)}

/* 収支サマリー（在庫タブ） */
.summary{background:var(--surface);border-radius:14px;padding:16px;margin-bottom:12px;display:flex;flex-direction:column;gap:14px}
.sum-head{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted);font-weight:500}
.profit{display:flex;flex-direction:column;gap:2px}
.profit .lbl{font-size:13px;color:var(--muted);font-weight:500}
.profit .big{font:700 34px var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.pair div{display:flex;flex-direction:column;gap:2px;min-width:0}
.pair .lbl{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.04em}
.pair .v{font:700 20px var(--num);font-variant-numeric:tabular-nums}
.pair .sub{font-size:12px;color:var(--muted)}

/* 状態別タイル */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px}
.tile{background:var(--surface);border:0;border-radius:12px;padding:10px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;color:var(--fg);font-family:var(--font)}
.tile.on{box-shadow:inset 0 0 0 2px var(--c)}
.tile .top{display:flex;justify-content:space-between;align-items:center}
.dot{width:26px;height:26px;border-radius:50%;background:var(--c);display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700}
.tile .n{font:700 24px var(--num);font-variant-numeric:tabular-nums}
.tile .lbl{font-size:13px;font-weight:500;color:var(--muted)}

.section-title{display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 8px}
.section-title h2{font-size:20px;margin:0}
.section-title span{color:var(--muted);font-size:14px;font-family:var(--num)}

.list{background:var(--surface);border-radius:12px 12px 0 0;overflow:hidden}
.row{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.check{flex:none;width:22px;height:22px;margin-top:2px;border-radius:50%;border:2px solid var(--c);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0}
.check.done{background:var(--c)}
.check.done::after{content:"";width:6px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.body{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.line1{display:flex;align-items:flex-start;gap:10px}
.name{flex:1;min-width:0}
.name input{width:100%;border:0;background:transparent;font:16px/1.4 var(--font);color:var(--fg);padding:1px 0;outline:none}
.row.is-done .name input{color:var(--muted)}

/* 金額＋日付 */
.money{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:12px;color:var(--muted)}
.amt{display:flex;flex-direction:column;gap:2px;background:var(--field);border-radius:8px;padding:5px 9px}
.amt .a{display:flex;align-items:center;gap:4px}
.amt .a span{font-weight:500}
.amt input.v{width:5.2em;border:0;background:transparent;font:500 14px var(--num);font-variant-numeric:tabular-nums;color:var(--fg);outline:none;padding:0;text-align:right}
.amt input.v::placeholder{color:var(--muted)}
.amt input.d{border:0;background:transparent;font:500 11px var(--num);color:var(--muted);padding:0;outline:none;width:8.6em;min-height:16px}
.amt:focus-within{box-shadow:0 0 0 2px var(--accent)}
.arrow{color:var(--muted)}
.pl{margin-left:auto;font:700 14px var(--num);font-variant-numeric:tabular-nums}
.pl.none{color:var(--muted);font-weight:500;font-family:var(--font);font-size:12px}

.pill{position:relative;flex:none}
.pill select{appearance:none;-webkit-appearance:none;border:0;border-radius:999px;background:var(--cbg);color:var(--c);font:700 13px var(--font);padding:6px 26px 6px 12px;cursor:pointer}
.pill::after{content:"";position:absolute;right:11px;top:50%;width:6px;height:6px;border:solid var(--c);border-width:0 2px 2px 0;transform:translateY(-70%) rotate(45deg);pointer-events:none}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.del{flex:none;width:24px;height:24px;margin-top:1px;border-radius:50%;border:0;background:var(--s1);color:#fff;font-size:16px;line-height:1;cursor:pointer;display:none}
.editing .del{display:block}

.add{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border-radius:0 0 12px 12px}
.add .plus{flex:none;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:18px;font-weight:700;line-height:1}
.add input{flex:1;min-width:0;border:0;background:transparent;font:16px var(--font);color:var(--fg);outline:none;padding:4px 0}
.add input::placeholder{color:var(--muted)}
.add button{border:0;background:none;color:var(--accent);font:700 15px var(--font);cursor:pointer}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:14px;border-bottom:1px solid var(--line)}
.note{margin:16px 4px 0;font-size:12px;color:var(--muted);line-height:1.7}

/* 収支タブ */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--field);border-radius:9px;padding:2px;margin-bottom:14px}
.seg button{border:0;background:transparent;border-radius:7px;padding:7px 0;font:500 14px var(--font);color:var(--fg);cursor:pointer}
.seg button.on{background:var(--surface);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.pnav button{width:36px;height:36px;border-radius:50%;border:0;background:var(--surface);color:var(--accent);font:700 18px var(--num);cursor:pointer}
.pnav button:disabled{opacity:.35;cursor:default}
.pnav .pl-title{font-size:18px;font-weight:700;text-align:center;flex:1;min-width:0}
.pnav .pl-title small{display:block;font:500 12px var(--num);color:var(--muted);margin-top:2px}
.today-btn{display:block;margin:-4px auto 12px;border:0;background:none;color:var(--accent);font:500 13px var(--font);cursor:pointer}

.card{background:var(--surface);border-radius:14px;padding:16px;margin-bottom:12px}
.card h3{margin:0 0 12px;font-size:14px;color:var(--muted);font-weight:500}
.stats3{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;border-top:1px solid var(--line);padding-top:12px;margin-top:14px}
.stats3 div{display:flex;flex-direction:column;gap:2px}
.stats3 .lbl{font-size:12px;color:var(--muted);font-weight:500}
.stats3 .v{font:700 18px var(--num);font-variant-numeric:tabular-nums}
.stats3 .sub{font-size:12px;color:var(--muted)}

.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chart{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;align-items:end}
.col{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;padding:6px 0 4px;border-radius:10px;cursor:pointer;color:var(--fg);font-family:var(--font);min-width:0}
.col.on{background:var(--field)}
.bars{height:120px;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px;border-bottom:1px solid var(--line)}
.bars span{width:32%;max-width:16px;border-radius:4px 4px 0 0;min-height:1px}
.bars .s{background:var(--barSale)} .bars .c{background:var(--barCost)}
.col .lb{font-size:11px;font-weight:500;color:var(--muted);white-space:nowrap}
.col.on .lb{color:var(--fg);font-weight:700}
.col .nt{font:700 10px var(--num);font-variant-numeric:tabular-nums;white-space:nowrap}
.col .nt.zero{color:var(--muted);font-weight:500}
.chart-max{font:500 11px var(--num);color:var(--muted);margin-bottom:4px}

.brk{list-style:none;margin:0;padding:0}
.brk li{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.brk li:last-child{border-bottom:0}
.brk .nm{min-width:0;flex:1;font-size:15px;overflow-wrap:anywhere}
.brk .nm small{display:block;font:500 12px var(--num);color:var(--muted);margin-top:1px}
.brk .r{text-align:right;font:700 15px var(--num);font-variant-numeric:tabular-nums;white-space:nowrap}
.brk .r small{display:block;font-size:12px;font-weight:500}
.brk-empty{color:var(--muted);font-size:14px;padding:6px 0}

/* 下部タブバー */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--bar);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 16px calc(6px + env(safe-area-inset-bottom, 0px));z-index:10}
.tabbar .in{display:grid;grid-template-columns:1fr 1fr;width:100%;max-width:560px}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;color:var(--muted);font:500 11px var(--font);cursor:pointer}
.tabbar button.on{color:var(--accent)}
.tabbar svg{width:26px;height:26px}
@media (max-width:420px){.tiles{gap:8px}.tile{padding:8px 10px}.tile .n{font-size:20px}.profit .big{font-size:30px}.chart{gap:2px}}
</style>
</head>
<body>

<div class="wrap">
  <!-- 在庫タブ -->
  <section id="tabStock">
    <header>
      <h1>在庫</h1>
      <button class="edit-btn" id="editBtn" type="button">編集</button>
    </header>

    <section class="summary" aria-label="収支">
      <div class="sum-head"><span id="sumScope">すべての商品</span><span id="sumCount"></span></div>
      <div class="profit"><span class="lbl">利益（売上 − 獲得）</span><span class="big" id="sumProfit">¥0</span></div>
      <div class="pair">
        <div><span class="lbl">獲得金額</span><span class="v yen" id="sumCost">¥0</span><span class="sub" id="sumCostSub"></span></div>
        <div><span class="lbl">売上金額</span><span class="v yen" id="sumSale">¥0</span><span class="sub" id="sumSaleSub"></span></div>
      </div>
    </section>

    <div class="tiles" id="tiles"></div>

    <div class="section-title"><h2 id="listTitle">すべて</h2><span id="listCount"></span></div>
    <div class="list" id="list"></div>
    <form class="add" id="addForm" autocomplete="off">
      <span class="plus" aria-hidden="true">+</span>
      <input id="newName" type="text" placeholder="新しい商品を追加" aria-label="商品名">
      <button type="submit">追加</button>
    </form>
    <p class="note">金額を入れると、その日の日付が自動で入ります。日付はタップして変更できます。獲得金額は獲得日、売上金額は売上日の期間に集計されます。サンプルの商品が入っています（「編集」から削除できます）。</p>
  </section>

  <!-- 収支タブ -->
  <section id="tabStats" hidden>
    <header><h1>収支</h1></header>
    <div class="seg" role="tablist" aria-label="集計の単位">
      <button type="button" id="modeMonth" class="on">月別</button>
      <button type="button" id="modeWeek">週別</button>
    </div>
    <div class="pnav">
      <button type="button" id="prevP" aria-label="前の期間">‹</button>
      <div class="pl-title" id="pTitle"></div>
      <button type="button" id="nextP" aria-label="次の期間">›</button>
    </div>
    <button type="button" class="today-btn" id="todayP" hidden>今日に戻る</button>

    <div class="card">
      <div class="profit"><span class="lbl">収支（売上 − 獲得）</span><span class="big" id="pNet">¥0</span></div>
      <div class="stats3">
        <div><span class="lbl">売上金額</span><span class="v" id="pSale">¥0</span><span class="sub" id="pSaleN"></span></div>
        <div><span class="lbl">獲得金額</span><span class="v" id="pCost">¥0</span><span class="sub" id="pCostN"></span></div>
      </div>
    </div>

    <div class="card">
      <h3 id="chartTitle">直近6か月</h3>
      <div class="legend"><span><i style="background:var(--barSale)"></i>売上</span><span><i style="background:var(--barCost)"></i>獲得</span></div>
      <div class="chart-max" id="chartMax"></div>
      <div class="chart" id="chart"></div>
    </div>

    <div class="card">
      <h3>売れた商品</h3>
      <ul class="brk" id="soldList"></ul>
    </div>
    <div class="card">
      <h3>獲得した商品</h3>
      <ul class="brk" id="boughtList"></ul>
    </div>
  </section>
</div>

<nav class="tabbar" aria-label="画面の切り替え">
  <div class="in">
    <button type="button" id="goStock" class="on">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="5" cy="6" r="1.6" fill="currentColor" stroke="none"/><circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="5" cy="18" r="1.6" fill="currentColor" stroke="none"/><path d="M9.5 6h10M9.5 12h10M9.5 18h10"/></svg>
      在庫
    </button>
    <button type="button" id="goStats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20h16"/><rect x="5.5" y="11" width="3" height="6.5" rx="1" fill="currentColor" stroke="none"/><rect x="10.5" y="6" width="3" height="11.5" rx="1" fill="currentColor" stroke="none"/><rect x="15.5" y="9" width="3" height="8.5" rx="1" fill="currentColor" stroke="none"/></svg>
      収支
    </button>
  </div>
</nav>

<script>
const STATUSES=[
  {k:"未獲得",c:"--s0",bg:"--s0bg"},
  {k:"販売中",c:"--s1",bg:"--s1bg"},
  {k:"梱包済み",c:"--s2",bg:"--s2bg"},
  {k:"発送中",c:"--s3",bg:"--s3bg"},
  {k:"完了",c:"--s4",bg:"--s4bg"},
];
const KEY="zaiko-v1";

/* ---------- 日付ユーティリティ ---------- */
const pad=n=>String(n).padStart(2,"0");
const toStr=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{if(!s)return null;const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const daysAgo=n=>{const d=today();d.setDate(d.getDate()-n);return toStr(d)};
function periodStart(d,mode){
  if(mode==="month") return new Date(d.getFullYear(),d.getMonth(),1);
  const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const wd=(x.getDay()+6)%7; x.setDate(x.getDate()-wd); return x; // 月曜はじまり
}
function shift(start,mode,n){
  return mode==="month"?new Date(start.getFullYear(),start.getMonth()+n,1)
                       :new Date(start.getFullYear(),start.getMonth(),start.getDate()+7*n);
}
const inP=(s,start,mode)=>{const d=parse(s);return !!d&&d>=start&&d<shift(start,mode,1)};
const md=d=>`${d.getMonth()+1}/${d.getDate()}`;

/* ---------- データ ---------- */
const SAMPLE={
  1:{cost:1800,sale:3200,costDate:daysAgo(40),saleDate:daysAgo(3)},
  2:{cost:400,sale:1200,costDate:daysAgo(20),saleDate:daysAgo(5)},
  3:{cost:1500,sale:2980,costDate:daysAgo(70),saleDate:daysAgo(12)},
  4:{cost:null,sale:null,costDate:null,saleDate:null},
  5:{cost:2500,sale:4800,costDate:daysAgo(95),saleDate:daysAgo(45)},
  6:{cost:3000,sale:5500,costDate:daysAgo(130),saleDate:daysAgo(100)},
  7:{cost:800,sale:null,costDate:daysAgo(2),saleDate:null},
};
let items=null, firstRun=false;
try{items=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!Array.isArray(items)){firstRun=true;items=[
  {id:1,name:"ニンテンドースイッチ用 コントローラー",st:"販売中"},
  {id:2,name:"無印良品 ステンレスボトル 500ml",st:"梱包済み"},
  {id:3,name:"ユニクロ ウルトラライトダウン M",st:"発送中"},
  {id:4,name:"文庫本まとめ売り 5冊",st:"未獲得"},
  {id:5,name:"ワイヤレスイヤホン（箱付き）",st:"完了"},
  {id:6,name:"レゴ クラシック 中サイズ",st:"完了"},
  {id:7,name:"アウトドア用 折りたたみチェア",st:"販売中"},
]}
// 旧バージョンのデータを補完
items.forEach(it=>{
  const s=SAMPLE[it.id];
  if(!("cost" in it)){it.cost=s?s.cost:null;it.sale=s?s.sale:null}
  if(!("costDate" in it)){
    it.costDate=s&&s.cost===it.cost?s.costDate:(it.cost!=null?toStr(today()):null);
    it.saleDate=s&&s.sale===it.sale?s.saleDate:(it.sale!=null?toStr(today()):null);
  }
});

let filter="all", editing=false, mode="month", cur=periodStart(today(),"month");
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}};
if(firstRun) save();
const S=k=>STATUSES.find(s=>s.k===k);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const yen=n=>"¥"+Math.abs(n).toLocaleString("ja-JP");
const signed=n=>(n>0?"+":n<0?"−":"")+yen(n);
const cls=n=>n>0?"pos":n<0?"neg":"";
const has=v=>typeof v==="number"&&!isNaN(v);
const view=()=>filter==="all"?items:items.filter(x=>x.st===filter);

/* ---------- 在庫タブ ---------- */
function renderSummary(){
  const rows=view();
  const costRows=rows.filter(x=>has(x.cost)), saleRows=rows.filter(x=>has(x.sale));
  const cost=costRows.reduce((a,x)=>a+x.cost,0), sale=saleRows.reduce((a,x)=>a+x.sale,0);
  const profit=rows.filter(x=>has(x.cost)&&has(x.sale)).reduce((a,x)=>a+x.sale-x.cost,0);
  document.getElementById("sumScope").textContent=filter==="all"?"すべての商品":filter+"の商品";
  document.getElementById("sumCount").textContent=rows.length+"件";
  const p=document.getElementById("sumProfit");
  p.textContent=signed(profit);p.className="big yen "+cls(profit);
  document.getElementById("sumCost").textContent=yen(cost);
  document.getElementById("sumSale").textContent=yen(sale);
  document.getElementById("sumCostSub").textContent=costRows.length+"件分";
  document.getElementById("sumSaleSub").textContent=saleRows.length+"件分";
}
function renderTiles(){
  const tiles=[{k:"all",label:"すべて",c:"--accent",n:items.length},
    ...STATUSES.map(s=>({k:s.k,label:s.k,c:s.c,n:items.filter(x=>x.st===s.k).length}))];
  document.getElementById("tiles").innerHTML=tiles.map(t=>`
    <button class="tile ${filter===t.k?"on":""}" style="--c:var(${t.c})" data-f="${t.k}" type="button">
      <span class="top"><span class="dot">${t.k==="all"?"≡":""}</span><span class="n">${t.n}</span></span>
      <span class="lbl">${t.label}</span>
    </button>`).join("");
}
function plHTML(it){
  if(!has(it.cost)||!has(it.sale)) return `<span class="pl none">利益 —</span>`;
  const d=it.sale-it.cost;
  return `<span class="pl ${cls(d)}">${signed(d)}</span>`;
}
function amtHTML(it,f,df,label){
  return `<div class="amt">
    <label class="a"><span>${label}</span>¥<input class="v" id="${f}${it.id}" data-f="${f}" inputmode="numeric" placeholder="—" value="${has(it[f])?it[f].toLocaleString("ja-JP"):""}" aria-label="${label}金額"></label>
    <input class="d" type="date" id="${df}${it.id}" data-d="${df}" value="${it[df]||""}" aria-label="${label}日">
  </div>`;
}
function renderList(){
  const rows=view();
  document.getElementById("listTitle").textContent=filter==="all"?"すべて":filter;
  document.getElementById("listCount").textContent=rows.length+"件";
  const list=document.getElementById("list");
  list.classList.toggle("editing",editing);
  if(!rows.length){list.innerHTML=`<div class="empty">「${filter}」の商品はありません</div>`;return}
  list.innerHTML=rows.map(it=>{const s=S(it.st);return `
    <div class="row ${it.st==="完了"?"is-done":""}" style="--c:var(${s.c});--cbg:var(${s.bg})" data-id="${it.id}">
      <button class="del" type="button" aria-label="削除">−</button>
      <button class="check ${it.st==="完了"?"done":""}" type="button" aria-label="完了にする"></button>
      <div class="body">
        <div class="line1">
          <div class="name"><input id="n${it.id}" value="${esc(it.name)}" aria-label="商品名"></div>
          <label class="pill"><select id="s${it.id}" aria-label="ステータス">
            ${STATUSES.map(o=>`<option ${o.k===it.st?"selected":""}>${o.k}</option>`).join("")}
          </select></label>
        </div>
        <div class="money">
          ${amtHTML(it,"cost","costDate","獲得")}
          <span class="arrow" aria-hidden="true">→</span>
          ${amtHTML(it,"sale","saleDate","売上")}
          ${plHTML(it)}
        </div>
      </div>
    </div>`}).join("");
}

/* ---------- 収支タブ ---------- */
function totals(start){
  const sold=items.filter(x=>has(x.sale)&&inP(x.saleDate,start,mode));
  const bought=items.filter(x=>has(x.cost)&&inP(x.costDate,start,mode));
  const sale=sold.reduce((a,x)=>a+x.sale,0), cost=bought.reduce((a,x)=>a+x.cost,0);
  return {sold,bought,sale,cost,net:sale-cost};
}
function titleOf(start){
  if(mode==="month") return {t:`${start.getFullYear()}年${start.getMonth()+1}月`,s:""};
  const end=shift(start,"week",1);end.setDate(end.getDate()-1);
  return {t:`${md(start)}〜${md(end)}`,s:`${start.getFullYear()}年 月曜はじまり`};
}
const shortLabel=start=>mode==="month"?`${start.getMonth()+1}月`:`${md(start)}`;

function renderStats(){
  const now=periodStart(today(),mode);
  const t=totals(cur), ti=titleOf(cur);
  document.getElementById("pTitle").innerHTML=esc(ti.t)+(ti.s?`<small>${esc(ti.s)}</small>`:"");
  document.getElementById("nextP").disabled=cur>=now;
  document.getElementById("todayP").hidden=+cur===+now;
  const net=document.getElementById("pNet");
  net.textContent=signed(t.net);net.className="big yen "+cls(t.net);
  document.getElementById("pSale").textContent=yen(t.sale);
  document.getElementById("pCost").textContent=yen(t.cost);
  document.getElementById("pSaleN").textContent=t.sold.length+"件売れた";
  document.getElementById("pCostN").textContent=t.bought.length+"件獲得";

  // グラフ：選択中の期間を右端に直近6期間
  const periods=[...Array(6)].map((_,i)=>shift(cur,mode,i-5));
  const data=periods.map(p=>({p,...totals(p)}));
  const max=Math.max(1,...data.map(d=>Math.max(d.sale,d.cost)));
  document.getElementById("chartTitle").textContent=mode==="month"?"直近6か月":"直近6週";
  document.getElementById("chartMax").textContent="最大 "+yen(max);
  document.getElementById("chart").innerHTML=data.map(d=>`
    <button type="button" class="col ${+d.p===+cur?"on":""}" data-t="${+d.p}" aria-label="${esc(titleOf(d.p).t)} 売上${yen(d.sale)} 獲得${yen(d.cost)}">
      <span class="bars"><span class="s" style="height:${d.sale/max*100}%"></span><span class="c" style="height:${d.cost/max*100}%"></span></span>
      <span class="lb">${shortLabel(d.p)}</span>
      <span class="nt ${d.net===0?"zero":cls(d.net)}">${d.net===0?"±0":signed(d.net).replace("¥","")}</span>
    </button>`).join("");

  const sortD=(a,b,k)=>(b[k]||"").localeCompare(a[k]||"");
  document.getElementById("soldList").innerHTML=t.sold.length?t.sold.sort((a,b)=>sortD(a,b,"saleDate")).map(x=>{
    const pr=has(x.cost)?x.sale-x.cost:null;
    return `<li><span class="nm">${esc(x.name)}<small>${md(parse(x.saleDate))} 売上</small></span>
      <span class="r">${yen(x.sale)}${pr===null?`<small style="color:var(--muted)">獲得額なし</small>`:`<small class="${cls(pr)}">利益 ${signed(pr)}</small>`}</span></li>`}).join("")
    :`<li class="brk-empty">この期間に売れた商品はありません</li>`;
  document.getElementById("boughtList").innerHTML=t.bought.length?t.bought.sort((a,b)=>sortD(a,b,"costDate")).map(x=>
    `<li><span class="nm">${esc(x.name)}<small>${md(parse(x.costDate))} 獲得・${esc(x.st)}</small></span><span class="r">${yen(x.cost)}</span></li>`).join("")
    :`<li class="brk-empty">この期間に獲得した商品はありません</li>`;
}

const render=()=>{renderSummary();renderTiles();renderList()};

/* ---------- イベント ---------- */
document.getElementById("tiles").addEventListener("click",e=>{
  const t=e.target.closest(".tile");if(!t)return;
  filter=(filter===t.dataset.f&&t.dataset.f!=="all")?"all":t.dataset.f;render();
});
const list=document.getElementById("list");
const itemOf=el=>items.find(x=>x.id==el.closest(".row").dataset.id);
list.addEventListener("change",e=>{
  const el=e.target;
  if(el.tagName==="SELECT"){itemOf(el).st=el.value;save();render()}
  if(el.dataset.d){itemOf(el)[el.dataset.d]=el.value||null;save()}
});
list.addEventListener("input",e=>{
  const el=e.target;if(el.tagName!=="INPUT"||el.dataset.d)return;
  const it=itemOf(el);
  if(el.dataset.f){
    const digits=el.value.replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/\D/g,"");
    const f=el.dataset.f, df=f==="cost"?"costDate":"saleDate";
    it[f]=digits===""?null:Number(digits);
    el.value=digits===""?"":Number(digits).toLocaleString("ja-JP");
    if(it[f]!=null&&!it[df]){it[df]=toStr(today());el.closest(".amt").querySelector(".d").value=it[df]}
    el.closest(".money").querySelector(".pl").outerHTML=plHTML(it);
    renderSummary();
  } else it.name=el.value;
  save();
});
list.addEventListener("click",e=>{
  if(!e.target.closest(".row"))return;
  const it=itemOf(e.target);
  if(e.target.closest(".check")){
    if(it.st==="完了"){it.st=it.prev||"販売中"}else{it.prev=it.st;it.st="完了"}
    save();render();
  }
  if(e.target.closest(".del")){items=items.filter(x=>x!==it);save();render()}
});
document.getElementById("addForm").addEventListener("submit",e=>{
  e.preventDefault();const inp=document.getElementById("newName");const v=inp.value.trim();if(!v)return;
  items.push({id:Date.now(),name:v,st:filter==="all"?"未獲得":filter,cost:null,sale:null,costDate:null,saleDate:null});
  inp.value="";save();render();
});
document.getElementById("editBtn").addEventListener("click",e=>{
  editing=!editing;e.target.textContent=editing?"完了":"編集";renderList();
});

function setMode(m){
  mode=m;cur=periodStart(today(),m);
  document.getElementById("modeMonth").classList.toggle("on",m==="month");
  document.getElementById("modeWeek").classList.toggle("on",m==="week");
  renderStats();
}
document.getElementById("modeMonth").onclick=()=>setMode("month");
document.getElementById("modeWeek").onclick=()=>setMode("week");
document.getElementById("prevP").onclick=()=>{cur=shift(cur,mode,-1);renderStats()};
document.getElementById("nextP").onclick=()=>{cur=shift(cur,mode,1);renderStats()};
document.getElementById("todayP").onclick=()=>{cur=periodStart(today(),mode);renderStats()};
document.getElementById("chart").addEventListener("click",e=>{
  const c=e.target.closest(".col");if(!c)return;cur=new Date(Number(c.dataset.t));renderStats();
});

function go(tab){
  const stats=tab==="stats";
  document.getElementById("tabStock").hidden=stats;
  document.getElementById("tabStats").hidden=!stats;
  document.getElementById("goStock").classList.toggle("on",!stats);
  document.getElementById("goStats").classList.toggle("on",stats);
  if(stats) renderStats(); else render();
  window.scrollTo(0,0);
}
document.getElementById("goStock").onclick=()=>go("stock");
document.getElementById("goStats").onclick=()=>go("stats");
render();
</script>
</body>
</html>
